version: '3.8'

services:
  app-nginx:
    build:
      context: ./docker/nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - nginx-cache:/var/cache/nginx
      - ./docker/nginx/default.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      app-network:
        ipv4_address: 172.20.0.5
    restart: unless-stopped
    environment:
      - NGINX_HOST=localhost

  php:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html
      - php-cache:/tmp
    networks:
      app-network:
        ipv4_address: 172.20.0.8
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - DATABASE_SERVER=mysql
      - DATABASE_USERNAME=seegap_user
      - DATABASE_PASSWORD=seegap_password
      - DATABASE_NAME=seegap_local
      - SITE_URL=http://localhost:8080/
      - PHP_OPCACHE_ENABLE=0
      - PHP_APCU_ENABLE=0

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      app-network:
        ipv4_address: 172.20.0.12
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: seegap_local_root
      MYSQL_DATABASE: seegap_local
      MYSQL_USER: seegap_user
      MYSQL_PASSWORD: seegap_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      app-network:
        ipv4_address: 172.20.0.15
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

volumes:
  redis-data:
    driver: local
  nginx-cache:
    driver: local
  php-cache:
    driver: local
  mysql-data:
    driver: local

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
